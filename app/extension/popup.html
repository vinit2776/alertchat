<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alert Insurance — Session Capture</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0; padding: 16px; width: 320px;
      background: #f0f4f8; color: #1a202c;
    }
    h1 { margin: 0 0 4px; font-size: 16px; color: #1a5276; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 14px; }

    label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin: 10px 0 4px; }
    input {
      width: 100%; padding: 8px 10px; border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: 13px; box-sizing: border-box;
    }
    input:focus { outline: none; border-color: #1a56db; }

    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .row input { flex: 1; }

    button {
      width: 100%; margin-top: 14px; padding: 11px;
      background: #1a56db; color: white; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    button:hover:not(:disabled) { background: #1447c0; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }

    .status {
      margin-top: 12px; padding: 10px; border-radius: 8px;
      font-size: 12px; line-height: 1.4; display: none;
    }
    .status.ok    { display: block; background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .status.err   { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .status.info  { display: block; background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }

    .settings-toggle {
      margin-top: 14px; font-size: 11px; color: #1a56db;
      cursor: pointer; text-align: center;
    }
    .settings { display: none; padding-top: 8px; border-top: 1px solid #e2e8f0; margin-top: 8px; }
    .settings.open { display: block; }
  </style>
</head>
<body>
  <h1>🚗 Alert Insurance</h1>
  <div class="sub">Send portal session to resume your quote</div>

  <label>Portal</label>
  <select id="portalId" style="width:100%;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;">
    <option value="uiic">United India Insurance (UIIC)</option>
    <option value="iciclombard">ICICI Lombard</option>
    <option value="tataaig">Tata AIG</option>
    <option value="bajaj">Bajaj Allianz</option>
    <option value="hdfcergo">HDFC ERGO</option>
    <option value="newindia">New India Assurance</option>
  </select>

  <label>Handoff ID <span style="font-weight:400;color:#94a3b8;">(from dashboard modal)</span></label>
  <input id="handoffId" placeholder="ho_xxxx_xxxxxxxx" autocomplete="off">

  <button id="sendBtn">📤 Send Session</button>

  <div id="status" class="status"></div>

  <div class="settings-toggle" id="settingsToggle">⚙️ Settings</div>
  <div class="settings" id="settings">
    <label>Backend URL</label>
    <input id="apiUrl" placeholder="https://alertchat-production.up.railway.app" autocomplete="off">
    <label>API Token (JWT from dashboard)</label>
    <input id="apiToken" type="password" placeholder="eyJ..." autocomplete="off">
    <button id="saveSettings" style="margin-top:8px;background:#059669;">Save settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
